[project]
name = "businessscience2"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.122.1",
    "matplotlib>=3.10.7",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "plotnine>=0.15.1",
    "pycaret>=2.2.2",
    "pydantic>=2.12.5",
    "pyjanitor>=0.32.1",
    "scikit-learn>=1.7.2",
    "streamlit>=1.51.0",
]

[dependency-groups]
dev = [
    "isort>=7.0.0",
    "ruff>=0.14.7",
]


[tool.ruff]
# Set the maximum line length to 79.
line-length = 79

[tool.ruff.lint]
# Add the `line-too-long` rule to the enforced rule set. By default, Ruff omits rules that
# overlap with the use of a formatter, like Black, but we can override this behavior by
# explicitly adding the rule.
ignore = ["E402"]


[tool.ruff.lint.pydocstyle]
convention = "google"


[tool.isort]
skip = ["janitor",".venv"]
