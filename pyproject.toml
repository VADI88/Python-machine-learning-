[project]
name = "businessscience2"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.8,<3.9"
dependencies = [
    "catboost==1.1.1",
    "fastapi==0.89.1",
    "h2o==3.40.0.1",
    "lightgbm==3.3.5",
    "loguru>=0.7.3",
    "matplotlib==3.5.3",
    "mlflow==1.28.0",
    "networkx==2.6.3",
    "numpy==1.19.5",
    "pandas==1.1.5",
    "pandas-flavor==0.2.0",
    "path>=17.0.0",
    "plotly==5.13.0",
    "pre-commit>=3.5.0",
    "pycaret==2.3.10",
    "pydantic>=1.10.24",
    "pyjanitor==0.21.2",
    "scikit-learn==0.23.2",
    "shap==0.41.0",
    "shiny==0.3.3",
    "sqlalchemy==1.4.46",
    "streamlit>=1.24.1",
    "uvicorn==0.20.0",
    "xgboost==1.6.2",
]


[tool.ruff]
# Set the maximum line length to 79.
line-length = 79

[tool.ruff.lint]
# Add the `line-too-long` rule to the enforced rule set. By default, Ruff omits rules that
# overlap with the use of a formatter, like Black, but we can override this behavior by
# explicitly adding the rule.
ignore = ["E402"]


[tool.ruff.lint.pydocstyle]
convention = "google"


[tool.isort]
skip = ["janitor",".venv"]

[dependency-groups]
dev = [
    "isort>=5.13.2",
    "ruff>=0.14.7",
]
